<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-36.41 -36.41 372.82 372.82" role="img">
  <title>Multi Screen Recorder app icon</title>
  <desc>Graphite rounded tile with three displays fanned in depth and one red record dot on the front display. Layers: tile, displays (back, middle, front with stand), dot.</desc>
  <g id="tile">
    <rect x="0" y="0" width="300" height="300" rx="67" fill="#1E2330"/>
  </g>
  <g id="displays">
    <rect id="display-back" x="29" y="43.4" width="184" height="127" rx="9" fill="#415070"/>
    <rect id="display-middle" x="57.8" y="72" width="184" height="127" rx="9" fill="#6E7CA0"/>
    <g id="display-front">
      <rect x="86.4" y="100.2" width="184" height="127" rx="9" fill="#E6EBF7"/>
      <path d="M158.9 227 L198.4 227 L201.9 255.6 L154.9 255.6 Z" fill="#D5DAE6"/>
      <rect x="144" y="255.6" width="69" height="5" rx="2.5" fill="#D5DAE6"/>
    </g>
  </g>
  <g id="dot">
    <circle cx="178.6" cy="160.8" r="24" fill="#FF3B30"/>
  </g>
</svg>
