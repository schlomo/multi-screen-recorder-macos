<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <header>
      {{- /* The app icon artwork at 2x its 8rem display width */}}
      {{- with (resources.Get "images/app-icon-fancy.jpeg").Resize "256x webp q85" }}
      <a href="/"><img src="{{ .RelPermalink }}" alt="" width="128" height="128" fetchpriority="high" /></a>
      {{- end }}
      <h1>{{ site.Title }}</h1>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      <a href="{{ site.Params.legalNoticeURL }}">Legal notice &amp; privacy policy</a>
      &middot;
      <a href="{{ site.Params.repositoryURL }}">Source on GitHub</a>
    </footer>
  </body>
</html>
