name: Crash report
description: Multi Screen Recorder quit unexpectedly
title: "Crash: "
body:
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing when it crashed?
    validations:
      required: false
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: "Drag the .txt file that Finder shows into this field. Issues are public: check the file for anything you don't want to share, such as your user name, before you submit."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "The app's log of the last 2 hours helps to find the cause. In Terminal, run the command below and paste its output here; check it first, as it names your displays, audio devices and folders."
      value: |
        log show --last 2h --predicate 'subsystem == "org.schapiro.multiscreenrecorder" and process == "msr"'
      render: text
    validations:
      required: false
