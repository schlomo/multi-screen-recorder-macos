name: Problem report
description: Something went wrong while recording or with the app
title: "Problem: "
body:
  - type: textarea
    id: version
    attributes:
      label: Output of msr version
      description: "In Terminal, run `msr version` and paste its output here. Without the msr link, run `\"/Applications/Multi Screen Recorder.app/Contents/MacOS/msr\" version`."
      placeholder: msr version
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Issues are public.** The recording's `recording.json` and `recording.log` name your screens, cameras and audio devices (in the file names, `screen`, `camera`, `audioSource` and the events; a camera's name can hold a person's name, as a Continuity Camera's often does), and the identifiers macOS gives them (`screenUUID`, `cameraUniqueID`, and `audioSourceUID`, which can hold a device's serial number). The recordings themselves show what the cameras saw; attach none. They also hold the date and time the recording started and ended, with your time zone's offset, and its problems, whose text can name a folder with your Mac's user name in its path. `recording.log` also names your Mac's model and macOS version, your settings and the recording folder's path. Remove or replace anything you don't want to share before you submit.
  - type: textarea
    id: files
    attributes:
      label: Files from the recording folder
      description: "Drag the recording folder's recording.json and recording.log here."
    validations:
      required: false
